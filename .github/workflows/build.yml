name: Build OunceIdent

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git sudo

      - name: Install Ounce devkit (libounce, OunceVK, libkaihen)
        run: |
          git clone --depth 1 https://github.com/ouncebrew/ounce-devkit /tmp/ounce-devkit
          sh /tmp/ounce-devkit/install.sh

      - name: Install SDL2 portlibs
        run: dkp-pacman -S --needed --noconfirm switch-sdl2 switch-sdl2_image switch-sdl2_ttf switch-freetype switch-libpng switch-libjpeg-turbo switch-zlib

      - name: Build
        run: make -j$(nproc)

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: OunceIdent-nro
          path: |
            OunceIdent.nro
            OunceIdent.elf
